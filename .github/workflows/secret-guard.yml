name: secret-guard

# Backstop for the pre-commit hook in .githooks/. The hook is what actually
# prevents disclosure, since it runs before anything leaves the machine; by the
# time this workflow fails, a secret is already on GitHub and needs rotating,
# not amending. It runs anyway, because "everyone remembered to enable the
# hook" is not a security control.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard reads history via `git show HEAD:` and `git grep HEAD`,
          # so it needs a real checkout rather than a blob-less one.
          fetch-depth: 1

      - name: Scan for plaintext credentials
        run: sh scripts/secret-guard.sh
